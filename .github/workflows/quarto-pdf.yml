name: Render Quarto PDFs and Upload

on:
  push:
    branches:
      - main
    paths:
      - "**.qmd"
      - "_quarto.yml"
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render PDFs defined in _quarto.yml
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: pdf

      - name: Prepare upload directory
        run: |
          mkdir -p output_upload
          cp _output/*.pdf output_upload/

      - name: Publish PDFs to pdf-output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output_upload
          publish_branch: pdf-output
          commit_message: "Update rendered PDFs [skip ci]"
          force_orphan: true
